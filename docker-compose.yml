services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecomm
      POSTGRES_PASSWORD: ecomm
      POSTGRES_DB: ecomm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomm -d ecomm"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    ports: ["6379:6379"]
  migrate:
    build: .
    command: ["python", "-m", "app.infra.migrate"]
    user: root
    environment:
      DATABASE_URL: postgresql+asyncpg://ecomm:ecomm@db:5432/ecomm
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
  worker:
    build: .
    env_file: [.env]
    command: ["celery", "-A", "app.workers.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://ecomm:ecomm@db:5432/ecomm
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    ports: ["8000:8000"]
volumes:
  pgdata:
