[project]
name = "ecomm-enterprise-assistant"
version = "2.0.0"
description = "Production-oriented e-commerce RAG assistant"
requires-python = ">=3.11"
dependencies = [
 "streamlit>=1.40,<2",
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
 "httpx>=0.27,<1", "redis>=5,<7", "asyncpg>=0.29,<1", "sqlalchemy[asyncio]>=2.0,<3",
 "langgraph>=0.6,<2", "langchain-core>=0.3,<2", "langchain-openai>=0.3,<2",
 "langchain-astradb>=0.6,<2", "structlog>=24,<27", "python-jose[cryptography]>=3.3,<4",
 "prometheus-client>=0.21,<1", "opentelemetry-api>=1.25,<2", "opentelemetry-sdk>=1.25,<2",
 "opentelemetry-instrumentation-fastapi>=0.46b0,<1", "opentelemetry-exporter-otlp>=1.25,<2",
 "tenacity>=8,<10", "mcp>=1.10,<2", "celery[redis]>=5.4,<6", "langchain-groq>=0.3,<2"
]
[project.optional-dependencies]
observability = ["langfuse>=3,<5"]
eval = ["ragas>=0.3,<1", "deepeval>=2,<5"]
dev = ["pytest>=8,<10","pytest-asyncio>=0.24,<2","ruff>=0.8,<1","httpx>=0.27,<1"]
[build-system]
requires=["setuptools>=70"]
build-backend="setuptools.build_meta"
[tool.setuptools.packages.find]
include=["app*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
[tool.ruff]
line-length=110
