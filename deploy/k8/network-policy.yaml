apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ecomm-default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ecomm-api-allow-ingress}
spec:
  podSelector: {matchLabels: {app: ecomm-api}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
    ports: [{protocol: TCP, port: 8000}]
# Update ingress namespace/pod labels to match the actual installed ingress controller.
